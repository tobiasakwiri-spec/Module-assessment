<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="search-container">
        <h1 id="title">Word Definitions</h1>
         <div id="resultSection" class="result-section">
        <p class="status-msg">Welcome to Wordly! This is a simple web application that allows you to search for words and their meanings.</p>
    </div>
        <form id="searchForm" class="search-form">
            <input type="text" id="searchInput" placeholder="Enter a word" required>
            <button type="submit" class="search-button">Search</button>
        </form>
    </div>
        <script src="script.js"></script>
    
</body>
</html>
